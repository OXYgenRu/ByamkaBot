# Полный публичный шаблон Byamka.
# Токен Telegram хранится только в .env / окружении процесса.
# Справочник, ограничения и примеры: docs/GUIDE.md.

# Приложение и каталоги
app:
  # Название приложения. Информационное поле: сейчас не меняет поведение и не задаёт имя бота в
  # Telegram.
  name: byamka
  # Уровень журналирования: DEBUG, INFO, WARNING или ERROR. INFO показывает этапы обработки и вызовы
  # моделей; DEBUG даёт больше служебных деталей.
  log_level: INFO
  # Каталог дополнительных данных: изображений и SVG fingerprint. Пути SQLite и Qdrant задаются
  # отдельно; изменение этого поля их не переносит.
  data_dir: ./data

# Подключение Telegram
telegram:
  # Имя переменной окружения с токеном BotFather. Здесь указывается имя переменной, а сам токен хранится
  # в .env или окружении процесса.
  token_env: TELEGRAM_BOT_TOKEN
  # Режим форматирования Telegram: null для обычного текста, HTML или MarkdownV2 для разметки.
  # Произвольные ответы модели могут содержать невалидную разметку; null — самый простой вариант.
  parse_mode: null

# Имя, стиль и демонстрационные диалоги
bot:
  # Имя персонажа в системных инструкциях и контексте. Не переименовывает аккаунт Telegram; при внешнем
  # файле примеров должно совпадать с speaker.
  display_name: Бямка
  # Username для идентификации бота в контексте. При запуске Telegram-бота автоматически заменяется
  # значением get_me(); обычно оставляется null.
  username: null
  # Список дополнительных имён персонажа для системной инструкции. Сам по себе не превращает упоминание
  # имени обычным текстом в прямое обращение роутера.
  identity_aliases: []
  # Основная инструкция о манере общения: тон, краткость, юмор, язык, приоритеты. Передаётся в системном
  # промпте генерации ответа; удобно писать от первого лица.
  personality: Я Бямка, участник Telegram-чата. Отвечаю понятно и кратко на языке собеседника.
  # Встроенный список вымышленных диалогов для демонстрации стиля. В каждом диалоге чередуются user и
  # assistant; подробнее — в разделе о примерах.
  dialogue_examples: []
  # Для своих примеров скопируй config/dialogue_examples.example.yaml в config/dialogue_examples.yaml,
  # затем укажи здесь dialogue_examples.yaml. Путь считается от каталога выбранного конфига.
  # В целевом файле speaker должен совпадать с display_name, а dialogues содержит пары user/assistant.
  # Добавить скопированную переписку Telegram можно командой из корня проекта:
  # python scripts/add_dialogue_example.py --telegram-text переписка.txt --replace-speaker "Имя участника" --dry-run
  # Убери --dry-run для записи. Подробнее — в docs/GUIDE.md, раздел «Примеры диалогов и стиль».
  # null отключает внешний файл; не совмещается с непустым dialogue_examples.
  dialogue_examples_file: null
  # Максимальная длина видимого ответа в символах. Длинный текст обрезается с многоточием; это
  # ограничение после генерации, а не токенный бюджет модели.
  max_visible_answer_chars: 1800
  # Поле совместимости, сейчас не используется для выбора языка. Нужный язык задаётся в personality; ряд
  # служебных промптов написан на русском.
  default_language: ru

# Модели и генерация
llm:
  # Размер пакета обработки входного контекста; больше требует больше рабочей памяти GPU.
  num_batch: 1024
  # Срок удержания основной модели после запроса; первый запуск всё равно требует загрузки.
  keep_alive: "3h"
  # HTTP-адрес Ollama без /api/chat на конце. Один сервер используется для генерации и embeddings; можно
  # указать локальный сервер или адрес доступного сервера.
  base_url: http://127.0.0.1:11434
  # Точное имя установленной в Ollama модели. Одна модель обслуживает ответы, роутер, сводки, извлечение
  # фактов и планирование инструментов; при vision — также изображения.
  chat_model: deepseek-r1:8b
  # Модель векторных представлений для поиска фактов и интересов. Должна быть установлена отдельно от
  # chat_model; смена модели требует пересоздания совместимых векторов.
  embedding_model: nomic-embed-text
  # Передавать think=true в обычных вызовах модели. Роутер и повторная оценка после памяти принудительно
  # используют think=false. Поддержка зависит от выбранной модели.
  thinking: true
  # Размер контекстного окна, передаваемый Ollama как num_ctx. В него должны помещаться инструкции,
  # примеры, история, память, изображения и бюджет генерации.
  context_window_tokens: 8192
  # Бюджет генерации обычного ответа в токенах. При thinking=true клиент прибавляет
  # reserve_thinking_tokens к общему num_predict; жёсткого разделения внутри Ollama нет.
  reserve_response_tokens: 700
  # Дополнительный бюджет рассуждений в токенах для вызовов с thinking. Он уменьшает место для входного
  # контекста и прибавляется к лимиту генерации.
  reserve_thinking_tokens: 1200
  # Температура обычных ответов. Более низкое значение уменьшает вариативность, более высокое делает
  # ответы разнообразнее; эффект зависит от модели.
  temperature: 0.65
  # Температура решения, отвечать ли на сообщение, и повторного решения после поиска памяти.
  router_temperature: 0.1
  # Температура фонового сжатия текущей истории. Для импорта действует отдельная
  # telegram_import.summary_temperature.
  summarizer_temperature: 0.2
  # Тайм-аут HTTP-запросов к Ollama в секундах. Увеличивается для медленного оборудования или долгой
  # генерации; это не общий дедлайн всей обработки сообщения.
  request_timeout_sec: 180

# Изображения
vision:
  # Обработка изображений. В публичном шаблоне выключена, поскольку пример chat_model текстовый. Нужна
  # модель с поддержкой изображений; дефолт класса Config без YAML — true.
  enabled: false
  # Предел размера загружаемого изображения в байтах. 10485760 = 10 МиБ. Проверяется заявленный размер и
  # фактически загружаемый поток.
  max_download_bytes: 10485760
  # Максимальное число пикселей исходного изображения до уменьшения: ширина × высота. Слишком большое
  # изображение отклоняется.
  max_pixels: 25000000
  # Максимальная длина стороны сохранённого изображения в пикселях. Пропорции сохраняются; большие
  # изображения уменьшаются.
  max_side: 1024
  # Максимальное число изображений в одном запросе ответа к модели. Не добавляет отдельную сборку
  # Telegram-альбомов.
  max_images_per_request: 1
  # Оценочный резерв токенов на одно изображение при упаковке промпта. Это бюджет приложения, а не
  # точный размер изображения в токенах выбранной модели.
  reserve_image_tokens: 4096
  # Бюджет текстового описания изображения для памяти. При включённом thinking клиент дополнительно
  # добавляет бюджет рассуждений.
  description_tokens: 512

# Когда бот отвечает
routing:
  # Пауза после последнего сообщения в чате перед обработкой. Новая реплика продлевает ожидание; 0
  # отключает паузу. Уже начатый ответ не отменяется.
  message_debounce_seconds: 1.0
  # Поле совместимости: сейчас роутер не читает этот флаг. Установка false не отключает ответы на reply
  # к боту.
  answer_on_direct_reply: true
  # Поле совместимости: сейчас роутер не читает этот флаг. Установка false не отключает ответы на
  # @username или личные сообщения.
  answer_on_mention: true
  # Разрешить реакции без явного обращения. false также отключает автоматическое распознавание
  # продолжения диалога без reply/@username; прямые обращения сохраняются.
  allow_spontaneous_replies: true
  # Базовый порог уверенности роутера для спонтанного ответа, обычно от 0 до 1. Более высокий порог
  # уменьшает число таких ответов; интересы могут его снизить.
  spontaneous_reply_min_confidence: 0.72
  # Базовый порог для прямого обращения. В текущей реализации прямые обращения обходят отсев по низкой
  # уверенности, поэтому это не способ заставить бота игнорировать упоминания.
  direct_reply_min_confidence: 0.2
  # Минимальный интервал после последнего ответа для нового спонтанного ответа, в секундах. Прямое
  # обращение и распознанное продолжение диалога обходят этот фильтр.
  chat_cooldown_seconds: 12
  # Лимит ответов бота среди недавних сообщений для спонтанных реакций. Прямые обращения и продолжение
  # диалога обходят ограничение.
  max_bot_replies_in_recent_window: 3
  # Число последних сообщений, отбираемых для роутера и проверки активности бота. Дополнительно
  # действует context.router_history_tokens.
  recent_window_messages: 12
  # Окно продолжения разговора после ответа бота, в секундах. Проверяется тот же собеседник и отсутствие
  # переключения на другого участника.
  followup_window_seconds: 180
  # Порог уверенности для распознанного продолжения разговора без прямого обращения. Ниже порог — легче
  # продолжить беседу.
  dialogue_reply_min_confidence: 0.5
  # Повторно оценивать уместность ответа после поиска фактов. Вызов пропускается при пустой памяти и для
  # уже распознанного продолжения диалога.
  post_memory_review_enabled: true
  # Разрешить второму проходу отменить ответ на прямое обращение. false сохраняет решение отвечать на
  # прямые обращения.
  allow_post_memory_ignore_direct: false
  # Минимальная уверенность повторного роутера, необходимая для отмены ответа после поиска памяти.
  post_memory_ignore_min_confidence: 0.65
  # Лимит токенов JSON-решения второго роутера. Этот вызов работает без thinking, независимо от
  # llm.thinking.
  post_memory_review_num_predict: 512

# Контекст и токенные бюджеты
context:
  # Верхняя граница токенного бюджета несжатой истории. Фактический бюджет ограничен
  # llm.context_window_tokens за вычетом остальных резервов.
  history_max_tokens: 14000
  # Доля доступного бюджета истории, при достижении которой запускается фоновое сжатие старого
  # фрагмента. 0.9 означает 90%.
  history_compact_ratio: 0.9
  # Целевая доля бюджета, оставляемая свежей несжатой истории после сжатия. 0.5 означает 50%; самый
  # новый элемент сохраняется.
  history_keep_ratio: 0.5
  # Максимальный токенный бюджет последних сообщений для роутера. Не определяет размер истории,
  # доступной генератору ответа.
  router_history_tokens: 2500
  # Запас токенов на служебную упаковку и неточность оценки. Увеличение уменьшает доступный объём
  # истории.
  prompt_safety_tokens: 1024
  # Верхний бюджет демонстрационных диалогов. Диалоги включаются целиком; слишком длинные пропускаются,
  # а фактический бюджет может быть меньше.
  examples_max_tokens: 1200
  # Резервный лимит сообщений для отдельного чтения ChatStateBuilder. В основном конвейере передаётся
  # уже отобранная история, поэтому это не лимит контекста ответа.
  recent_messages_limit: 40
  # Резерв места для свежей истории при выборе объёма примеров. Не является жёстким ограничением всей
  # истории ответа.
  recent_messages_soft_limit_tokens: 2500
  # Максимальное число последних сводок, запрашиваемых для промпта. Итоговый объём также ограничивается
  # общим бюджетом.
  summaries_limit: 6
  # Максимум обычных тематических фактов для поиска и добавления в ответ. Поведенческие правила ищутся
  # отдельно с лимитом 4 в коде.
  facts_limit: 5
  # Максимум результатов инструментов, рассматриваемых при сборке контекста ответа. Не увеличивает
  # tools.max_tool_calls.
  tool_results_limit: 4
  # Дополнительный резерв для текущего сообщения при распределении места между примерами и историей. Не
  # является лимитом длины входного сообщения.
  current_message_extra_tokens: 400
  # Минимальное сходство найденного тематического факта с запросом. Чем выше порог, тем меньше
  # нерелевантной памяти попадёт в ответ.
  facts_min_score: 0.55
  # Минимальное сходство для найденных правил поведения и предпочтений собеседников. Это отдельный
  # фильтр от facts_min_score.
  behavior_facts_min_score: 0.55

# Сжатие текущей истории
summarization:
  # Фоновое сжатие текущей истории в сводки. При false старая история остаётся на диске, но может
  # перестать помещаться в запросы модели.
  enabled: true
  # Устаревшее поле, сейчас не используется. Остаток истории определяется context.history_keep_ratio и
  # токенным бюджетом.
  keep_recent_messages: 35
  # Устаревшее поле, сейчас не используется. Триггер сжатия определяется context.history_compact_ratio,
  # а не числом сообщений.
  min_unsummarized_messages: 25
  # Устаревшее поле, сейчас не используется. Размер сжимаемого фрагмента выбирается по доступному
  # токенному бюджету.
  chunk_size: 30
  # Лимит генерации одной фоновой сводки. Более длинная сводка может сохранить больше деталей, но
  # занимает больше места в следующих запросах.
  max_summary_tokens: 600

# SQLite
storage:
  # Путь к SQLite. Здесь хранятся сообщения, сводки, факты, интересы, метаданные изображений и события
  # инструментов. Новый путь открывает другую базу, не переносит старую.
  sqlite_path: ./data/bot.sqlite3

# Векторная память
vector_db:
  # Информационное поле совместимости. Реализован локальный Qdrant; изменение строки не подключает
  # другой backend или удалённый сервер.
  provider: qdrant_local
  # Каталог локального Qdrant. Отдельный сервер Qdrant не нужен. Не запускай одновременно два процесса с
  # одним каталогом локального хранилища.
  qdrant_path: ./data/qdrant
  # Имя коллекции embeddings фактов. Для другой embedding-модели используй новую коллекцию и заново
  # индексируй факты; старые векторы автоматически не пересчитываются.
  collection: bot_facts
  # Лимит результатов поиска по умолчанию, в том числе для /memory и инструмента поиска. Для контекста
  # ответа отдельно применяется context.facts_limit.
  search_limit: 5

# Характер и интересы
personality_engine:
  # Включить семантический движок интересов и обучение темам чата. При false текстовая personality
  # продолжает работать, но профиль интересов в ответ не добавляется.
  enabled: true
  # Число, определяющее воспроизводимую проекцию и врождённые предпочтения. Смена seed меняет их и
  # fingerprint, но не удаляет уже выученные темы из SQLite.
  seed: 73421
  # Размерность пространства, в которое проецируются embeddings. Минимум в реализации — 2; увеличение
  # резко повышает стоимость многомерного Perlin-поля.
  latent_dim: 6
  # Масштаб координат поля интересов. Большее значение даёт более частые изменения предпочтений между
  # близкими точками.
  noise_scale: 2.7
  # Количество слоёв фрактального шума, минимум 1. Больше слоёв — более подробное поле и больше
  # вычислений.
  octaves: 4
  # Множитель амплитуды каждого следующего слоя шума. Определяет вклад мелких деталей поля относительно
  # крупных.
  persistence: 0.55
  # Базовая составляющая итогового интереса к теме до учёта врождённого и выученного интереса, новизны и
  # повторов.
  base_interest: 0.35
  # Вес врождённого интереса в итоговом интересе. Его вклад сверху ограничивает max_innate_contribution.
  innate_weight: 0.2
  # Вес интереса к темам, выученным в текущем чате, в итоговой оценке.
  learned_weight: 0.35
  # Вес новизны относительно нейтрального значения 0.5. Новая тема может повышать итоговый интерес,
  # знакомая — понижать.
  novelty_weight: 0.28
  # Верхняя граница вклада врождённого интереса. Не позволяет одному seed полностью определять итоговую
  # оценку темы.
  max_innate_contribution: 0.12
  # Минимальное сходство сообщения с сохранённой темой для учёта выученного интереса.
  learned_similarity_threshold: 0.72
  # Максимальное число похожих сохранённых тем, участвующих в оценке одного сообщения. Не ограничивает
  # общее число тем в базе.
  learned_topics_limit: 5
  # Порог сходства для обновления существующей темы вместо создания новой. Ниже порог — более широкое
  # объединение тем.
  topic_merge_similarity: 0.86
  # Скорость роста выученного интереса при положительном сигнале во время обновления темы.
  learn_rate: 0.08
  # Доля затухания старого интереса при обновлении темы. Это не ежедневное или часовое фоновое
  # затухание.
  learn_decay: 0.015
  # Сила уменьшения интереса при слабом сигнале относительно save_interest_threshold.
  learn_negative_rate: 0.04
  # Дополнительное уменьшение выученного интереса за повторяемость темы.
  learn_repetition_decay: 0.1
  # Нижняя граница оценки выученного интереса при создании и обновлении темы.
  min_learned_interest: 0.02
  # Окно штрафа за недавно встречавшуюся похожую тему, в минутах. Штраф постепенно уменьшается; 0
  # отключает этот временной штраф.
  topic_cooldown_minutes: 180
  # Максимальный масштаб штрафа за недавний повтор. Фактическое значение зависит от сходства и времени с
  # прошлого появления темы.
  repeated_topic_penalty: 0.35
  # Сила уменьшения новизны по числу встреч с темой. Используется с log(1 + seen_count).
  novelty_seen_count_strength: 0.08
  # Верхняя граница штрафа новизны за многократные встречи с темой.
  max_novelty_penalty: 0.45
  # При таком штрафе повторяемости роутер перестаёт смягчать пороги из-за интереса. Само сообщение этот
  # параметр не блокирует.
  repetition_bias_block_threshold: 0.18
  # Порог оси reply профиля, после которого базовый порог спонтанного ответа может снижаться. Это не
  # порог итогового final_interest.
  boost_reply_threshold: 0.66
  # Порог оси reply для усиления уверенности уже разрешённой спонтанной реакции. Не отменяет ignore и
  # ограничения частоты.
  spontaneous_reply_threshold: 0.84
  # Порог оси memory для интереса к запоминанию, сохранения тем и усиления обращения к памяти.
  memory_interest_threshold: 0.76
  # Порог итогового интереса для сохранения/обновления темы и расчёта положительного сигнала обучения.
  # Высокая ось memory также может разрешить сохранение.
  save_interest_threshold: 0.72
  # На сколько снизить базовый порог спонтанного ответа при достаточно высокой оси reply и отсутствии
  # сильного штрафа повторов; итог не ниже 0.05.
  router_threshold_discount: 0.12
  # Количество ячеек по каждой стороне SVG fingerprint, минимум в рендерере — 24. Работа растёт примерно
  # с квадратом размера.
  fingerprint_size: 96
  # Размер одной ячейки SVG в пикселях, минимум 2. Например, 96 × 5 даёт поле 480 × 480 пикселей плюс
  # подпись.
  fingerprint_cell_px: 5

# Импорт истории
telegram_import:
  # Поле совместимости: текущий импортёр и CLI не проверяют его. false не блокирует импорт; он
  # запускается только явным вызовом скрипта.
  enabled: true
  # Сохранять исходные сообщения при вызове импортёра из Python без явного переопределения. В CLI это
  # управляется флагом --no-messages.
  import_messages: true
  # Создавать сводки импортированных сообщений при вызове импортёра из Python. В CLI используется --no-
  # summaries; сводкам нужны записи сообщений в SQLite.
  build_summaries: true
  # Извлекать факты, правила и темы при вызове импортёра из Python. В CLI используется --no-facts.
  extract_facts: true
  # Обновлять темы интересов по импортированным сообщениям при вызове импортёра из Python. В CLI
  # используется --no-interests; нужен включённый personality_engine.
  update_interests: true
  # negative_export_id сохраняет экспортные ID как отрицательные для отделения от новых Telegram-
  # сообщений. preserve оставляет исходные ID.
  message_id_mode: negative_export_id
  # Пропускать сервисные события экспорта, например изменения состава группы.
  skip_service_messages: true
  # Пропускать записи без текста. Импортёр работает с текстовой историей и не переносит изображения в
  # vision-память.
  skip_empty_text: true
  # Минимальная длина текста сообщения в символах для включения в извлечение фактов.
  min_text_chars_for_facts: 10
  # Минимальная длина текста в символах для повторного проигрывания через движок интересов.
  min_text_chars_for_interests: 4
  # Число сообщений в одном фрагменте для импортной сводки. Уменьшай при длинных сообщениях или
  # небольшом контекстном окне.
  summary_chunk_size: 80
  # Лимит генерации одной импортной сводки. При thinking клиент добавляет общий резерв рассуждений.
  summary_max_tokens: 900
  # Температура сводок при импорте. Не зависит от llm.summarizer_temperature для текущей переписки.
  summary_temperature: 0.15
  # Помечать сообщения успешно обработанного фрагмента как сжатые после сохранения его сводки.
  mark_imported_messages_summarized: true
  # Число подходящих сообщений в одном запросе извлечения импортных фактов.
  fact_chunk_size: 60
  # Максимальное число фактов из одного импортного фрагмента.
  max_facts_per_chunk: 12
  # Минимальная оценка уверенности модели для сохранения импортного факта.
  fact_min_confidence: 0.76
  # Порог сходства с уже сохранённым фактом, начиная с которого новый импортный факт считается
  # дубликатом.
  fact_duplicate_score_threshold: 0.91
  # Температура извлечения фактов из экспортированной истории.
  fact_temperature: 0.0
  # Бюджет JSON с фактами из одного фрагмента. Увеличивай вместе с max_facts_per_chunk; при thinking
  # добавляется резерв рассуждений.
  fact_num_predict: 1100
  # Максимум последних подходящих сообщений для обновления интересов. 0 означает все подходящие
  # сообщения.
  interest_max_messages: 0
  # Период вывода прогресса обработки сообщений в консоль, в сообщениях.
  progress_every_messages: 100
  # Период вывода прогресса обработки сводок и фактов, в фрагментах.
  progress_every_chunks: 5

# Инструменты
tools:
  # Общий переключатель вызова инструментов через LLM-планировщик. Не отключает Telegram-команды /memory
  # и /remember или обычное извлечение памяти.
  enabled: true
  # Разрешить модели составлять план вызовов инструментов, когда роутер считает их нужными.
  planner_enabled: true
  # Разрешить зарегистрированные инструменты с пометкой side_effect. В стандартном наборе только
  # калькулятор и поиск памяти; флаг не добавляет shell или доступ к файлам.
  allow_side_effect_tools: false
  # Максимальное число вызовов из одного плана перед генерацией ответа.
  max_tool_calls: 3
  # Зарегистрировать калькулятор арифметических выражений на основе AST.
  calculator_enabled: true
  # Зарегистрировать инструмент семантического поиска по памяти текущего чата и глобальным фактам.
  memory_search_enabled: true

# Автоматическое запоминание
auto_memory:
  # Автоматически извлекать устойчивые факты из новых сообщений в фоне. Не отключает хранение самих
  # сообщений, /remember и поиск существующих фактов.
  enabled: true
  # Не анализировать сообщения, начинающиеся с /. Полезно, чтобы не извлекать факты из команд повторно.
  ignore_commands: true
  # Минимальная длина входного сообщения в символах для обращения к модели-экстрактору.
  min_text_chars: 12
  # Минимальная длина текста извлечённого факта в символах для сохранения.
  min_fact_chars: 20
  # Максимальное число кандидатов в факты, рассматриваемых из одного сообщения.
  max_facts_per_message: 3
  # Минимальная уверенность модели для сохранения факта. Более высокий порог делает память
  # избирательнее.
  min_confidence: 0.72
  # Порог сходства с существующим фактом, начиная с которого новый факт не сохраняется повторно.
  duplicate_score_threshold: 0.92
  # Температура автоматического извлечения фактов из текущей переписки.
  temperature: 0.0
  # Лимит генерации JSON с фактами одного сообщения; при thinking добавляется
  # llm.reserve_thinking_tokens.
  num_predict: 700
  # Разрешить фактам с scope=global сохраняться без chat_id и быть доступными в других чатах. false
  # сохраняет автоматически извлечённые факты в текущем чате.
  allow_global_facts: false
  # Снижение min_confidence при высокой оси memory, если экстрактору передан профиль интересов. Основной
  # фоновый обработчик сейчас профиль не передаёт, поэтому там скидка не применяется.
  interest_memory_confidence_discount: 0.08
